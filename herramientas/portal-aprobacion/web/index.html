<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sala de revisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Sala de proyección: el video manda (izquierda, fondo oscuro neutro), la conversación al costado; en celular, uno debajo del otro. */
  :root {
    --bg: #111214;
    --panel: #1a1c1f;
    --line: #2c2f34;
    --fg: #eceae6;
    --muted: #9a9890;
    --marker: #f2a93b;      /* color de "marca de tiempo", como la cinta del montajista */
    --marker-ink: #1d1406;
    --ok: #5cc28a;
    --ok-ink: #06140c;
    --warn: #ef7d62;
    --focus: #8cb4ff;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      /* Tonos oscurecidos para que el texto llegue a contraste 4.5:1 sobre fondo claro. */
      --bg: #f3f1ec; --panel: #ffffff; --line: #dcd8cf; --fg: #1d1c1a; --muted: #6b675e;
      --marker: #9a5800; --marker-ink: #fffaf0; --ok: #17703f; --ok-ink: #ffffff; --warn: #b03d22; --focus: #2457c5;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f1ec; --panel: #ffffff; --line: #dcd8cf; --fg: #1d1c1a; --muted: #6b675e;
    --marker: #9a5800; --marker-ink: #fffaf0; --ok: #17703f; --ok-ink: #ffffff; --warn: #b03d22; --focus: #2457c5;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* --decide-h la mide el script: así la barra fija nunca tapa el final de la página ni el elemento con foco. */
  html { scroll-padding-bottom: calc(var(--decide-h, 80px) + 8px); }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    padding-inline: 16px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(var(--decide-h, calc(80px + env(safe-area-inset-bottom, 0px))) + 16px);
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }

  /* Encabezado */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .top h1 { font-family: var(--font-display); font-size: clamp(22px, 3.2vw, 32px); line-height: 1.1; margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 14px; margin-top: 6px; }
  .top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.revision { color: var(--marker); }
  .pill.cambios { color: var(--warn); }
  .pill.aprobado { color: var(--ok); }
  label.sel { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

  .notice { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--marker); border-radius: 8px; padding: 10px 14px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; overflow-wrap: anywhere; }
  .notice.ok { border-left-color: var(--ok); }
  .notice.warn { border-left-color: var(--warn); }

  /* Cuerpo */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 24px; align-items: start; }
  .player { display: grid; gap: 12px; min-width: 0; }
  /* Alto tope: que en una notebook se vean la línea de tiempo y "Reproducir" sin bajar (sobre todo con videos verticales). */
  .screen { background: #000; border-radius: 12px; overflow: hidden; display: grid; place-items: center; max-height: max(260px, min(72vh, calc(100vh - 400px))); }
  video { display: block; width: 100%; max-height: max(260px, min(72vh, calc(100vh - 400px))); object-fit: contain; background: #000; }
  /* Va después de .screen y video: si no, sus 72vh le ganan y un video vertical tapa todo en el celular. */
  @media (max-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
    .screen, video { max-height: 58vh; }
    .decide-in .btn { flex: 1 1 auto; }
  }

  .timeline { position: relative; height: 34px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--fg); opacity: .75; }
  .head { position: absolute; top: 8px; width: 2px; height: 18px; background: var(--fg); transform: translateX(-1px); pointer-events: none; }
  /* El botón es la zona táctil (26 px, sin rotar, para no salirse por el borde en celular); el banderín se dibuja adentro. */
  .mk { position: absolute; top: -2px; width: 26px; height: 26px; margin-left: -13px; background: none; border: 0; padding: 0; cursor: pointer; }
  .mk::before { content: ""; position: absolute; left: 6px; top: 6px; width: 14px; height: 14px; border-radius: 3px 3px 3px 0; transform: rotate(-45deg); background: var(--marker); }
  .mk.resuelto::before { background: var(--muted); opacity: .6; }
  .mk.activo::before { outline: 2px solid var(--fg); outline-offset: 1px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 15px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--marker); color: var(--marker-ink); border-color: transparent; font-weight: 700; }
  .btn.ok { background: var(--ok); color: var(--ok-ink); border-color: transparent; font-weight: 700; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn[aria-busy="true"] { opacity: .5; cursor: progress; }
  .tc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
  .spacer { flex: 1; }

  /* Conversación */
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid; min-width: 0; }
  .side > section { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .side > section:last-child { border-bottom: 0; }
  .side h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 13px; color: var(--muted); }
  input[type="text"], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 92px; resize: vertical; }
  .stamp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; background: var(--marker); color: var(--marker-ink); font-family: var(--font-mono); font-size: 13px; font-weight: 500; border: 0; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip.general { background: var(--line); color: var(--fg); cursor: default; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }

  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .list { display: grid; gap: 0; max-height: 56vh; overflow-y: auto; margin: 0 -16px -16px; padding: 0; list-style: none; }
  .item { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .item.activo { background: color-mix(in srgb, var(--marker) 10%, transparent); }
  .item.resuelto .texto { color: var(--muted); }
  .item-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); }
  .autor { color: var(--fg); font-weight: 700; overflow-wrap: anywhere; }
  .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
  .tag.ok { color: var(--ok); border-color: currentColor; }
  .texto { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0 4px; }

  /* Barra de decisión */
  .decide { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
  .decide-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .decide p { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .confirm { display: grid; gap: 8px; width: 100%; }
  .confirm-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  /* El aviso flotante queda siempre en la página (vacío no se ve) para que los lectores de pantalla lo anuncien. */
  .toast { position: fixed; left: 50%; bottom: calc(var(--decide-h, 80px) + 12px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 6; max-width: calc(100% - 32px); }
  .toast:empty { padding: 0; background: none; }

  .help { color: var(--muted); font-size: 13px; }
  kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

  /* Celular y tablet: zonas táctiles más grandes y sin atajos de teclado. */
  @media (pointer: coarse) {
    .btn.small, .tab { min-height: 40px; }
    .chip { min-height: 32px; }
    input[type="checkbox"] { width: 20px; height: 20px; }
  }
  @media (hover: none) { .atajos { display: none; } }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand" id="estudio">Sala de revisión</div>
      <h1 id="pieza">Cargando la pieza…</h1>
      <div class="meta">
        <span id="cliente"></span>
        <span id="entrega"></span>
      </div>
    </div>
    <div class="top-right">
      <label class="sel" for="version">Versión
        <select id="version"></select>
      </label>
      <span class="pill revision" id="estado">En revisión</span>
    </div>
  </header>

  <div class="notice" id="aviso" hidden></div>

  <main class="stage">
    <div class="player">
      <div class="screen">
        <video id="video" playsinline preload="metadata" controlslist="nodownload"></video>
      </div>
      <div class="timeline" id="timeline" role="slider" aria-label="Línea de tiempo" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="head" id="head"></div>
        <div id="marcas"></div>
      </div>
      <div class="controls">
        <button class="btn" id="play" type="button" aria-label="Reproducir">▶ Reproducir</button>
        <button class="btn small ghost" id="atras" type="button" aria-label="Retroceder un segundo">−1 s</button>
        <button class="btn small ghost" id="adelante" type="button" aria-label="Adelantar un segundo">+1 s</button>
        <span class="tc"><span id="actual">0:00.0</span> / <span id="total">0:00.0</span></span>
        <button class="btn small ghost" id="velocidad" type="button" aria-label="Velocidad 1×">1×</button>
        <span class="spacer"></span>
        <button class="btn primary" id="comentarAqui" type="button">Comentar en <span class="tc" id="aquiTc">0:00.0</span></button>
      </div>
      <p class="help">Pausá donde quieras cambiar algo y dejá el comentario: queda pegado a ese segundo.<span class="atajos"> Atajos: <kbd>espacio</kbd> reproducir o pausar, <kbd>C</kbd> comentar acá.</span></p>
    </div>

    <aside class="side">
      <section aria-labelledby="t-nuevo">
        <h2 id="t-nuevo">Nuevo comentario</h2>
        <form id="form" novalidate>
          <div class="field">
            <label for="autor">Tu nombre</label>
            <input type="text" id="autor" maxlength="80" autocomplete="name" required aria-describedby="formMsg">
          </div>
          <div class="field" style="margin-top:10px">
            <label for="texto">Qué cambiarías</label>
            <textarea id="texto" maxlength="2000" required aria-describedby="formMsg" placeholder="Ej.: este texto en pantalla dura poco, ¿lo dejamos un segundo más?"></textarea>
          </div>
          <div class="stamp" style="margin-top:10px">
            <span>En</span>
            <button type="button" class="chip" id="stampChip" title="Ir a este momento">0:00.0</button>
            <button type="button" class="btn small ghost" id="stampAhora">Usar el momento actual</button>
            <label class="check"><input type="checkbox" id="general"> Comentario general</label>
          </div>
          <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center">
            <button class="btn primary" type="submit" id="enviar">Dejar comentario</button>
            <span class="help" id="formMsg" role="status"></span>
          </div>
        </form>
      </section>

      <section aria-labelledby="t-lista">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
          <h2 id="t-lista" tabindex="-1">Comentarios <span class="help" id="conteo"></span></h2>
          <div class="tabs" role="group" aria-label="Filtro">
            <button class="tab" type="button" data-filtro="abiertos" aria-pressed="true">Pendientes</button>
            <button class="tab" type="button" data-filtro="todos" aria-pressed="false">Todos</button>
          </div>
        </div>
        <ul class="list" id="lista"></ul>
      </section>
    </aside>
  </main>
</div>

<div class="decide" id="decide" role="region" aria-label="Aprobación">
  <div class="decide-in" id="decideIn"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Configuración ----------
  const CFG = Object.assign({ endpoint: '', estudio: 'Sala de revisión', proyectoPorDefecto: 'demo', refrescoSeg: 30 }, window.PORTAL_CONFIG || {});
  CFG.endpoint = String(CFG.endpoint || '').trim();
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(); }
  const slug = (params.get('p') || CFG.proyectoPorDefecto).replace(/[^a-z0-9-]/gi, '').toLowerCase();
  // Al pegar el link en un chat a veces se le suma un punto, coma o paréntesis final: la clave solo lleva letras, números, - y _.
  const clave = (params.get('k') || '').replace(/[^\w-]/g, '').slice(0, 64);

  const $ = (id) => document.getElementById(id);
  const video = $('video');

  // ---------- Utilidades ----------
  const fmt = (s) => {
    if (s == null || !isFinite(s)) return '—';
    s = Math.round(s * 10) / 10; // redondear antes de partir: si no, 9.96 sale "0:010.0" y 59.96 sale "0:60.0"
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  };
  const fecha = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  };
  const dia = (aaaammdd, opciones) => {
    const d = new Date(aaaammdd + 'T12:00:00');
    return isNaN(d) ? '' : d.toLocaleDateString('es-AR', opciones);
  };
  const norm = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids) if (kid != null) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const safeLS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento local */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* sin almacenamiento local */ } },
  };
  let toastTimer;
  const toast = (msg, ms) => {
    const t = $('toast');
    t.textContent = msg;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.textContent = ''; }, ms || 3000);
  };
  const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Errores: el backend contesta { ok: false, error: '<código>' }; 'red' y 'respuesta_invalida' los pone el navegador.
  const ERRORES = {
    sin_acceso: 'Este link no tiene permiso para comentar ni aprobar. Revisá que esté completo, igual al que te mandamos, o escribinos y te pasamos uno nuevo.',
    ocupado: 'Hay mucho movimiento en este momento. Probá de nuevo en unos segundos.',
    limite_de_comentarios: 'Esta pieza llegó al máximo de comentarios. Escribinos y lo seguimos por ahí.',
    limite_de_decisiones: 'Esta pieza llegó al máximo de respuestas. Escribinos y lo seguimos por ahí.',
    demasiados_pedidos: 'Llegamos al máximo de cambios por hora en esta pieza. Probá de nuevo en un rato o escribinos.',
    red:'Parece que no hay conexión. Revisá internet y probá de nuevo.',
  };
  const codigo = (e) => (e && e.message === 'proyecto_invalido' ? 'sin_acceso' : (e && e.message) || 'red');
  const mensajeError = (e) => ERRORES[codigo(e)] || 'Algo falló de nuestro lado. Probá de nuevo en un rato y, si sigue, avisanos.';
  // Si la conexión se cortó después de enviar, el dato pudo haber llegado igual: no hay que hacerlo repetir (quedaría duplicado).
  const pudoLlegar = (e) => codigo(e) === 'red' || codigo(e) === 'respuesta_invalida';

  // ---------- Almacenamiento: remoto (planilla) o local (demo) ----------
  function remoteStore() {
    const url = (accion, extra) => {
      const q = new URLSearchParams(Object.assign({ accion, proyecto: slug, clave }, extra || {}));
      return CFG.endpoint + (CFG.endpoint.includes('?') ? '&' : '?') + q.toString();
    };
    const pedir = async (destino, opciones) => {
      let r, j;
      try { r = await fetch(destino, opciones); } catch (e) { throw new Error('red'); }
      try { j = await r.json(); } catch (e) { throw new Error('respuesta_invalida'); } // por ejemplo, una página de error de HTML
      if (!j || !j.ok) throw new Error((j && j.error) || 'error');
      return j;
    };
    // Sin encabezados propios: así el navegador no hace "preflight" y el backend lo acepta.
    const post = (body) => pedir(CFG.endpoint, { method: 'POST', body: JSON.stringify(Object.assign({ proyecto: slug, clave }, body)) });
    return {
      modo: 'remoto',
      async listar() {
        const j = await pedir(url('listar'), { cache: 'no-store' });
        return { comentarios: Array.isArray(j.comentarios) ? j.comentarios : [], decisiones: Array.isArray(j.decisiones) ? j.decisiones : [] };
      },
      comentar: (c) => post({ accion: 'comentar', version: c.version, segundo: c.segundo, autor: c.autor, texto: c.texto }),
      estado: (id, estado) => post({ accion: 'estado', id, estado }),
      decidir: (d) => post({ accion: 'decidir', version: d.version, decision: d.decision, autor: d.autor, nota: d.nota }),
    };
  }

  function localStore(ejemplos) {
    const key = 'portal:' + slug;
    let mem = null;
    const load = () => {
      if (mem) return mem;
      const raw = safeLS.get(key);
      try { mem = raw ? JSON.parse(raw) : null; } catch (e) { mem = null; }
      if (!mem || !Array.isArray(mem.comentarios) || !Array.isArray(mem.decisiones)) {
        mem = { comentarios: (ejemplos && ejemplos.comentarios || []).map((c) => Object.assign({ ejemplo: true }, c)), decisiones: [] };
        save();
      }
      return mem;
    };
    const save = () => safeLS.set(key, JSON.stringify(mem));
    return {
      modo: 'demo',
      async listar() { const d = load(); return { comentarios: d.comentarios.slice(), decisiones: d.decisiones.slice() }; },
      async comentar(c) {
        const d = load();
        d.comentarios.push({ id: uid(), version: c.version, segundo: c.segundo, autor: c.autor, texto: c.texto, estado: 'abierto', creado: new Date().toISOString() });
        save();
      },
      async estado(id, estado) {
        const d = load();
        const c = d.comentarios.find((x) => x.id === id);
        if (c) { c.estado = estado; c.actualizado = new Date().toISOString(); save(); }
      },
      async decidir(dec) {
        const d = load();
        d.decisiones.push({ id: uid(), version: dec.version, decision: dec.decision, autor: dec.autor, nota: dec.nota, fecha: new Date().toISOString() });
        save();
      },
    };
  }

  // ---------- Estado de la página ----------
  const S = {
    proyecto: null, store: null, version: null,
    comentarios: [], decisiones: [],
    filtro: 'abiertos', activo: null,
    stamp: 0, general: false, confirmando: null, enviando: false, decidiendo: false,
    cargado: false, errorCarga: false, bloqueado: false, pedido: 0, firma: '',
  };
  const claveBorrador = 'portal:borrador:' + slug;

  const versionActual = () => S.proyecto.versiones.find((v) => v.id === S.version);
  const ultimaVersion = () => S.proyecto.versiones[S.proyecto.versiones.length - 1];
  const decisionDe = (vid) => {
    const ds = S.decisiones.filter((d) => d.version === vid);
    return ds.length ? ds[ds.length - 1] : null;
  };

  // ---------- Render ----------
  function renderEncabezado() {
    const p = S.proyecto;
    $('estudio').textContent = p.estudio || CFG.estudio;
    $('pieza').textContent = p.pieza || 'Pieza en revisión';
    $('cliente').textContent = p.cliente ? 'Para ' + p.cliente : '';
    const entrega = p.entrega ? dia(p.entrega, { day: 'numeric', month: 'long' }) : '';
    $('entrega').textContent = entrega ? 'Entrega: ' + entrega : '';
    document.title = (p.pieza || 'Pieza en revisión') + ' · Sala de revisión';

    const sel = $('version');
    sel.replaceChildren(...p.versiones.map((v) => {
      const f = v.fecha ? dia(v.fecha, { day: 'numeric', month: 'short' }) : '';
      return el('option', { value: v.id, selected: v.id === S.version }, v.id + (f ? ' · ' + f : ''));
    }));

    const d = decisionDe(S.version);
    const pill = $('estado');
    pill.className = 'pill ' + (d ? (d.decision === 'aprobado' ? 'aprobado' : 'cambios') : 'revision');
    pill.textContent = d ? (d.decision === 'aprobado' ? 'Aprobado' : 'Cambios pedidos') : 'En revisión';

    const aviso = $('aviso');
    const v = versionActual();
    const ult = ultimaVersion();
    const partes = [];
    aviso.className = 'notice' + (S.bloqueado || S.errorCarga ? ' warn' : '');
    if (S.bloqueado) {
      partes.push(el('span', null, ERRORES.sin_acceso));
    } else if (S.errorCarga) {
      partes.push(el('span', null, 'No pudimos traer los comentarios. ' + (S.errorCarga === 'red' ? 'Revisá tu conexión; volvemos' : 'Volvemos') + ' a probar solos en un momento.'));
    }
    if (v.id !== ult.id) {
      partes.push(el('span', null, 'Estás viendo la ' + v.id + '. Ya está la ' + ult.id + '.'));
      partes.push(el('button', { class: 'btn small', type: 'button', onclick: () => cambiarVersion(ult.id) }, 'Ver la ' + ult.id));
    } else if (v.nota) {
      partes.push(el('span', null, 'Novedades de la ' + v.id + ': ' + v.nota));
    }
    if (S.store && S.store.modo === 'demo') {
      partes.push(el('span', { class: 'help' }, 'Modo demo: los comentarios quedan solo en este navegador.'));
    }
    aviso.replaceChildren(...partes);
    aviso.hidden = partes.length === 0;
  }

  function comentariosDeVersion() {
    return S.comentarios.filter((c) => c.version === S.version);
  }

  function renderMarcas() {
    const dur = video.duration;
    const cont = $('marcas');
    if (!dur || !isFinite(dur)) { cont.replaceChildren(); return; }
    // Las marcas son un atajo para mouse y dedo; con teclado se llega a cada comentario desde la lista (sin cientos de paradas de Tab).
    cont.replaceChildren(...comentariosDeVersion().filter((c) => c.segundo != null).map((c) => el('button', {
      class: 'mk' + (c.estado === 'resuelto' ? ' resuelto' : '') + (S.activo === c.id ? ' activo' : ''),
      type: 'button', tabindex: '-1',
      style: 'left:' + Math.min(100, Math.max(0, (c.segundo / dur) * 100)) + '%',
      title: fmt(c.segundo) + ' · ' + (c.autor || 'Sin nombre'),
      'aria-label': 'Comentario de ' + (c.autor || 'Sin nombre') + ' en ' + fmt(c.segundo),
      onclick: (ev) => { ev.stopPropagation(); irA(c); },
    })));
  }

  function renderLista() {
    const todos = comentariosDeVersion();
    const abiertos = todos.filter((c) => c.estado !== 'resuelto');
    $('conteo').textContent = S.cargado ? '(' + abiertos.length + (abiertos.length === 1 ? ' pendiente' : ' pendientes') + ' de ' + todos.length + ')' : '';
    const visibles = (S.filtro === 'abiertos' ? abiertos : todos).slice().sort((a, b) => {
      const sa = a.segundo == null ? Infinity : a.segundo;
      const sb = b.segundo == null ? Infinity : b.segundo;
      return sa - sb || String(a.creado).localeCompare(String(b.creado));
    });
    const lista = $('lista');
    // Al redibujar, el foco vuelve al mismo botón (o al título si ese comentario ya no está en el filtro).
    const foco = lista.contains(document.activeElement) ? document.activeElement.getAttribute('data-foco') : null;
    const volverFoco = () => {
      if (!foco) return;
      const n = lista.querySelector('[data-foco="' + CSS.escape(foco) + '"]');
      (n || $('t-lista')).focus({ preventScroll: true });
    };
    if (!visibles.length) {
      let vacio;
      if (S.bloqueado) vacio = 'Con este link no se pueden ver los comentarios.';
      else if (!S.cargado) vacio = S.errorCarga ? 'No pudimos traer los comentarios todavía.' : 'Cargando comentarios…';
      else vacio = todos.length ? 'No quedan comentarios pendientes en la ' + S.version + '.' : 'Todavía no hay comentarios en la ' + S.version + '. Pausá el video donde quieras cambiar algo y escribilo en el formulario.';
      lista.replaceChildren(el('li', { class: 'item' }, el('p', { class: 'empty' }, vacio)));
      volverFoco();
      return;
    }
    lista.replaceChildren(...visibles.map((c) => {
      const resuelto = c.estado === 'resuelto';
      return el('li', { class: 'item' + (resuelto ? ' resuelto' : '') + (S.activo === c.id ? ' activo' : ''), id: 'com-' + c.id },
        el('div', { class: 'item-top' },
          c.segundo == null
            ? el('span', { class: 'chip general' }, 'General')
            : el('button', { class: 'chip', type: 'button', 'data-foco': 'ir:' + c.id, onclick: () => irA(c, true), 'aria-label': 'Ir a ' + fmt(c.segundo) }, fmt(c.segundo)),
          el('span', { class: 'autor' }, c.autor || 'Sin nombre'),
          el('span', null, fecha(c.creado)),
          c.ejemplo ? el('span', { class: 'tag' }, 'Ejemplo') : null,
          resuelto ? el('span', { class: 'tag ok' }, 'Resuelto') : null),
        el('p', { class: 'texto' }, c.texto),
        el('div', null, el('button', {
          class: 'btn small ghost', type: 'button', 'data-foco': 'estado:' + c.id,
          onclick: (ev) => cambiarEstado(c, resuelto ? 'abierto' : 'resuelto', ev.currentTarget),
        }, resuelto ? 'Reabrir' : 'Marcar como resuelto')));
    }));
    volverFoco();
  }

  function renderDecision() {
    const box = $('decideIn');
    const d = decisionDe(S.version);
    const pendientes = comentariosDeVersion().filter((c) => c.estado !== 'resuelto').length;
    // Un redibujo (por ejemplo, el refresco automático) no puede borrar la nota a medio escribir ni sacar el foco.
    const foco = box.contains(document.activeElement) ? document.activeElement.id : '';
    const notaPrevia = $('nota') ? $('nota').value : '';
    const devolverFoco = () => { if (foco && $(foco)) $(foco).focus(); };
    if (S.confirmando) {
      const aprobar = S.confirmando === 'aprobado';
      const ult = ultimaVersion();
      const vieja = S.version !== ult.id ? ' Ojo: no es la última versión (ya está la ' + ult.id + ').' : '';
      box.replaceChildren(el('div', { class: 'confirm' },
        el('p', { id: 'decisionTexto', tabindex: '-1' }, (aprobar
          ? (pendientes ? 'Vas a aprobar la ' + S.version + ' con ' + pendientes + ' comentario' + (pendientes === 1 ? '' : 's') + ' pendiente' + (pendientes === 1 ? '' : 's') + '. ¿Seguimos?' : 'Vas a aprobar la ' + S.version + ' como versión final.')
          : 'Vas a pedir cambios sobre la ' + S.version + '. Los comentarios pendientes son los que vamos a trabajar.') + vieja),
        el('div', { class: 'field' },
          el('label', { for: 'nota' }, aprobar ? 'Mensaje (opcional)' : '¿Algo más que tengamos que saber? (opcional)'),
          el('input', { type: 'text', id: 'nota', maxlength: '1000', value: notaPrevia })),
        el('div', { class: 'confirm-row' },
          el('button', { class: 'btn ' + (aprobar ? 'ok' : 'primary'), type: 'button', id: 'confirmar', disabled: S.decidiendo, onclick: () => decidir(S.confirmando) },
            S.decidiendo ? 'Guardando…' : (aprobar ? 'Confirmar aprobación' : 'Confirmar pedido de cambios')),
          el('button', { class: 'btn ghost', type: 'button', id: 'volver', disabled: S.decidiendo, onclick: cerrarConfirmacion }, 'Volver'))));
      devolverFoco();
      return;
    }
    const partes = [];
    if (d) {
      partes.push(el('p', { id: 'decisionTexto', tabindex: '-1' }, (d.decision === 'aprobado' ? '✓ Aprobada por ' : 'Cambios pedidos por ') + (d.autor || 'el cliente') + ' · ' + fecha(d.fecha) + (d.nota ? ' — “' + d.nota + '”' : '')));
    } else {
      partes.push(el('p', { id: 'decisionTexto', tabindex: '-1' }, '¿Cómo seguimos con la ' + S.version + '?'));
    }
    partes.push(el('span', { class: 'spacer' }));
    partes.push(el('button', { class: 'btn', type: 'button', id: 'pedirCambios', onclick: () => abrirConfirmacion('cambios') }, 'Pedir cambios'));
    partes.push(el('button', { class: 'btn ok', type: 'button', id: 'aprobar', onclick: () => abrirConfirmacion('aprobado') }, d && d.decision === 'aprobado' ? 'Aprobar de nuevo' : 'Aprobar esta versión'));
    box.replaceChildren(...partes);
    devolverFoco();
  }

  // Al abrir o cerrar la confirmación el botón que se tocó desaparece: el foco se lleva a un lugar que tenga sentido.
  function abrirConfirmacion(tipo) {
    S.confirmando = tipo; renderDecision();
    $('decisionTexto').focus();
  }
  function cerrarConfirmacion() {
    const tipo = S.confirmando;
    S.confirmando = null; renderDecision();
    const b = $(tipo === 'aprobado' ? 'aprobar' : 'pedirCambios');
    if (b) b.focus();
  }

  function renderStamp() {
    $('stampChip').textContent = S.general ? 'general' : fmt(S.stamp);
    $('stampChip').disabled = S.general;
    $('stampAhora').disabled = S.general;
    $('stampChip').setAttribute('aria-label', S.general ? 'Comentario general' : 'Ir a ' + fmt(S.stamp));
    $('enviar').textContent = S.general ? 'Dejar comentario general' : 'Dejar comentario en ' + fmt(S.stamp);
    guardarBorrador();
  }

  // Si el link no tiene acceso, no se ofrece comentar ni aprobar: todo fallaría al guardar.
  function renderAcceso() {
    $('t-nuevo').closest('section').hidden = S.bloqueado;
    $('comentarAqui').hidden = S.bloqueado;
    $('decide').hidden = S.bloqueado;
  }

  function renderTodo() {
    renderAcceso(); renderEncabezado(); renderMarcas(); renderLista(); renderDecision(); renderStamp();
  }

  // ---------- Borrador del comentario (solo en este navegador): un corte de luz o una recarga no lo pierden ----------
  function guardarBorrador() {
    if (!S.version) return;
    const t = $('texto').value;
    if (t.trim()) safeLS.set(claveBorrador, JSON.stringify({ t, v: S.version, s: S.stamp, g: S.general }));
    else safeLS.del(claveBorrador);
  }
  function recuperarBorrador() {
    let b = null;
    try { b = JSON.parse(safeLS.get(claveBorrador) || 'null'); } catch (e) { b = null; }
    if (!b || typeof b.t !== 'string' || !b.t.trim()) return;
    $('texto').value = b.t.slice(0, 2000);
    if (b.v === S.version) { S.stamp = Math.max(0, Number(b.s) || 0); S.general = !!b.g; $('general').checked = S.general; }
  }

  // ---------- Reproductor ----------
  const alternar = () => {
    if (!video.paused) { video.pause(); return; }
    const p = video.play();
    if (p && p.catch) p.catch(() => { /* sin video cargado o reproducción bloqueada: el aviso de error ya se muestra */ });
  };
  const syncPlay = () => {
    $('play').textContent = video.paused ? '▶ Reproducir' : '❚❚ Pausar';
    $('play').setAttribute('aria-label', video.paused ? 'Reproducir' : 'Pausar');
  };

  function cargarVideo() {
    const v = versionActual();
    const base = 'proyectos/' + slug + '/';
    // Una pieza pesada puede estar en otro almacenamiento: entonces "archivo" (y "poster") es una URL https completa.
    const ruta = (f) => (/^https:\/\//i.test(String(f)) ? String(f) : base + f);
    // Sin póster, Safari del iPhone muestra un cuadro negro hasta reproducir; pedir el cuadro 0,001 s lo evita.
    video.src = ruta(v.archivo) + (v.poster ? '' : '#t=0.001');
    if (v.poster) video.poster = ruta(v.poster); else video.removeAttribute('poster');
    $('total').textContent = fmt(NaN);
    video.load();
    syncPlay();
  }

  function actualizarTiempo() {
    const dur = video.duration || 0;
    const t = video.currentTime || 0;
    const pct = dur ? (t / dur) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('head').style.left = pct + '%';
    $('actual').textContent = fmt(t);
    $('aquiTc').textContent = fmt(t);
    const tl = $('timeline');
    tl.setAttribute('aria-valuenow', t.toFixed(1));
    tl.setAttribute('aria-valuetext', fmt(t));
  }

  function seekDesdeEvento(ev) {
    const r = $('timeline').getBoundingClientRect();
    const x = Math.min(Math.max(0, ev.clientX - r.left), r.width);
    if (video.duration) video.currentTime = (x / r.width) * video.duration;
  }

  function irA(c, desdeLista) {
    S.activo = c.id;
    // Un comentario puede tener un segundo mayor que la duración de esta versión: se va al final.
    if (c.segundo != null && video.duration) { video.pause(); video.currentTime = Math.max(0, Math.min(c.segundo, video.duration - 0.05)); }
    renderMarcas(); renderLista();
    const li = document.getElementById('com-' + c.id);
    if (!li) return;
    if (desdeLista) {
      // En celular la lista queda debajo: si el video no se ve, se sube hasta él para mostrar ese momento.
      const r = video.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) video.scrollIntoView({ block: 'nearest' });
    } else {
      // Desde la marca: se muestra el comentario moviendo solo la lista, no toda la página (el video sigue a la vista).
      const lista = $('lista');
      const lr = lista.getBoundingClientRect(), ir = li.getBoundingClientRect();
      if (ir.top < lr.top) lista.scrollTop += ir.top - lr.top;
      else if (ir.bottom > lr.bottom) lista.scrollTop += ir.bottom - lr.bottom;
    }
  }

  function marcarAqui() {
    if (S.bloqueado) return;
    video.pause();
    S.general = false; $('general').checked = false;
    S.stamp = Math.round((video.currentTime || 0) * 10) / 10;
    renderStamp();
    $(($('autor').value.trim() ? 'texto' : 'autor')).focus();
  }

  // ---------- Acciones ----------
  async function refrescar(silencioso) {
    const n = ++S.pedido; // si se cruzan dos pedidos, gana el último (uno viejo no puede pisar datos nuevos)
    try {
      const d = await S.store.listar();
      if (n !== S.pedido) return;
      const firma = JSON.stringify(d);
      const cambio = firma !== S.firma || !S.cargado || S.errorCarga || S.bloqueado;
      S.comentarios = d.comentarios; S.decisiones = d.decisiones; S.firma = firma;
      S.cargado = true; S.errorCarga = false; S.bloqueado = false;
      if (cambio) renderTodo(); // sin cambios no se redibuja: no se pierde el foco ni lo que se está escribiendo
    } catch (e) {
      if (n !== S.pedido) return;
      const bloqueado = codigo(e) === 'sin_acceso';
      // Un corte momentáneo con los comentarios ya cargados no merece un cartel; si nunca cargaron, sí.
      const errorCarga = !bloqueado && !S.cargado ? codigo(e) : false;
      const cambio = bloqueado !== S.bloqueado || errorCarga !== S.errorCarga;
      S.bloqueado = bloqueado; S.errorCarga = errorCarga;
      if (cambio) renderTodo();
      if (!silencioso) toast(bloqueado ? ERRORES.sin_acceso : 'No pudimos traer los comentarios. ' + mensajeError(e), 8000);
    }
  }

  // Después de un corte, se vuelve a leer la planilla: si lo enviado ya está, cuenta como guardado.
  async function llegoIgual(e, lista, coincide, antes) {
    if (!S.cargado || !pudoLlegar(e)) return false;
    await refrescar(true);
    return S[lista].filter(coincide).length > antes;
  }

  // Un link sin acceso (clave mal copiada, proyecto cerrado) se avisa una vez y se ocultan las acciones.
  function sinAcceso(e) {
    if (codigo(e) !== 'sin_acceso') return false;
    S.bloqueado = true; S.confirmando = null; renderTodo();
    toast(ERRORES.sin_acceso, 8000);
    return true;
  }

  async function enviarComentario(ev) {
    ev.preventDefault();
    if (S.enviando || !S.store || S.bloqueado) return;
    const autor = $('autor').value.trim();
    const texto = $('texto').value.trim();
    if (!autor) { $('formMsg').textContent = 'Poné tu nombre para saber de quién es el comentario.'; $('autor').focus(); return; }
    if (!texto) { $('formMsg').textContent = 'Escribí qué cambiarías.'; $('texto').focus(); return; }
    safeLS.set('portal:autor', autor);
    const version = S.version;
    const segundo = S.general ? null : S.stamp;
    const mismo = (c) => c.version === version && norm(c.autor) === norm(autor) && norm(c.texto) === norm(texto);
    const antes = S.comentarios.filter(mismo).length;
    S.enviando = true; $('enviar').disabled = true; $('formMsg').textContent = 'Guardando…';
    try {
      try {
        await S.store.comentar({ version, segundo, autor, texto });
      } catch (e) {
        if (!(await llegoIgual(e, 'comentarios', mismo, antes))) throw e;
      }
      $('texto').value = ''; safeLS.del(claveBorrador);
      $('formMsg').textContent = '';
      toast(segundo == null ? 'Comentario general guardado.' : 'Comentario guardado en ' + fmt(segundo) + '.');
      await refrescar(true);
    } catch (e) {
      if (!sinAcceso(e)) $('formMsg').textContent = 'No se pudo guardar. ' + mensajeError(e) + ' Tu texto sigue acá.';
    } finally {
      S.enviando = false; $('enviar').disabled = false;
      // Si el botón tenía el foco, al deshabilitarlo se perdió: se lo devolvemos para seguir con el teclado.
      if (!document.activeElement || document.activeElement === document.body) $('enviar').focus({ preventScroll: true });
    }
  }

  async function cambiarEstado(c, estado, boton) {
    if (!S.store || S.bloqueado || (boton && boton.getAttribute('aria-busy') === 'true')) return;
    if (boton) boton.setAttribute('aria-busy', 'true'); // sin "disabled", para no perder el foco del teclado
    try {
      await S.store.estado(c.id, estado);
      toast(estado === 'resuelto' ? 'Marcado como resuelto.' : 'Comentario reabierto.');
      await refrescar(true);
    } catch (e) {
      if (!sinAcceso(e)) toast('No se pudo actualizar el comentario. ' + mensajeError(e), 8000);
    } finally {
      if (boton) boton.removeAttribute('aria-busy');
    }
  }

  async function decidir(decision) {
    if (S.decidiendo || !S.store || S.bloqueado) return;
    const autor = $('autor').value.trim();
    if (!autor) {
      S.confirmando = null; renderDecision();
      $('formMsg').textContent = 'Antes de aprobar o pedir cambios, poné tu nombre arriba.';
      $('autor').focus();
      return;
    }
    const nota = ($('nota') && $('nota').value.trim()) || '';
    const version = S.version;
    const misma = (d) => d.version === version && d.decision === decision && norm(d.autor) === norm(autor);
    const antes = S.decisiones.filter(misma).length;
    S.decidiendo = true; renderDecision();
    try {
      try {
        await S.store.decidir({ version, decision, autor, nota });
      } catch (e) {
        if (!(await llegoIgual(e, 'decisiones', misma, antes))) throw e;
      }
      S.decidiendo = false; S.confirmando = null;
      renderDecision();
      toast(decision === 'aprobado' ? 'Versión aprobada. ¡Gracias!' : 'Listo: trabajamos los cambios y te mandamos la próxima versión.', 5000);
      await refrescar(true);
      if ($('decisionTexto')) $('decisionTexto').focus();
    } catch (e) {
      S.decidiendo = false;
      if (!sinAcceso(e)) { renderDecision(); toast('No se pudo guardar la decisión. ' + mensajeError(e), 8000); }
    }
  }

  function cambiarVersion(id) {
    S.version = id; S.activo = null; S.confirmando = null;
    cargarVideo(); renderTodo();
  }

  // ---------- Eventos ----------
  function enlazar() {
    $('play').addEventListener('click', alternar);
    video.addEventListener('play', syncPlay);
    video.addEventListener('pause', syncPlay);
    video.addEventListener('emptied', syncPlay); // al cambiar de versión mientras se reproduce, el video se detiene sin evento "pause"
    video.addEventListener('timeupdate', actualizarTiempo);
    video.addEventListener('seeked', actualizarTiempo);
    video.addEventListener('loadedmetadata', () => {
      $('total').textContent = fmt(video.duration);
      $('timeline').setAttribute('aria-valuemax', video.duration.toFixed(1));
      // Si el momento elegido venía de una versión más larga, no puede quedar después del final de esta.
      if (S.stamp > video.duration) { S.stamp = Math.floor(video.duration * 10) / 10; renderStamp(); }
      actualizarTiempo(); renderMarcas();
    });
    video.addEventListener('error', () => toast('No se pudo cargar el video de esta versión. Probá recargar la página; si sigue, avisanos.', 8000));
    video.addEventListener('click', alternar);

    const tl = $('timeline');
    let arrastrando = false;
    tl.addEventListener('pointerdown', (ev) => {
      if (ev.target.closest('.mk')) return; // la marca maneja su propio clic
      arrastrando = true; tl.setPointerCapture(ev.pointerId); seekDesdeEvento(ev);
    });
    tl.addEventListener('pointermove', (ev) => { if (arrastrando) seekDesdeEvento(ev); });
    tl.addEventListener('pointerup', () => { arrastrando = false; });
    tl.addEventListener('pointercancel', () => { arrastrando = false; });
    tl.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { video.currentTime = Math.min(video.duration || 0, video.currentTime + 1); ev.preventDefault(); }
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { video.currentTime = Math.max(0, video.currentTime - 1); ev.preventDefault(); }
      if (ev.key === 'Home') { video.currentTime = 0; ev.preventDefault(); }
      if (ev.key === 'End' && video.duration) { video.currentTime = video.duration; ev.preventDefault(); }
    });

    $('atras').addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 1); });
    $('adelante').addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 1); });
    // También como velocidad por defecto: así no vuelve sola a 1× (con el botón diciendo 0,5×) al cambiar de versión.
    video.addEventListener('ratechange', () => {
      const r = video.playbackRate === 1 ? '1×' : '0,5×';
      $('velocidad').textContent = r; $('velocidad').setAttribute('aria-label', 'Velocidad ' + r);
    });
    $('velocidad').addEventListener('click', () => {
      video.defaultPlaybackRate = video.playbackRate = video.playbackRate === 1 ? 0.5 : 1;
    });
    $('comentarAqui').addEventListener('click', marcarAqui);
    $('stampAhora').addEventListener('click', marcarAqui);
    $('stampChip').addEventListener('click', () => { if (video.duration) { video.pause(); video.currentTime = S.stamp; } });
    $('general').addEventListener('change', (ev) => { S.general = ev.target.checked; renderStamp(); });
    $('texto').addEventListener('input', guardarBorrador);
    $('texto').addEventListener('focus', () => {
      // Al empezar a escribir, el comentario toma el momento en pausa.
      if (!video.paused) { video.pause(); }
      if (!S.general && !$('texto').value) { S.stamp = Math.round((video.currentTime || 0) * 10) / 10; renderStamp(); }
    });
    $('form').addEventListener('submit', enviarComentario);
    $('version').addEventListener('change', (ev) => cambiarVersion(ev.target.value));
    document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
      S.filtro = b.dataset.filtro;
      document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      renderLista();
    }));
    document.addEventListener('keydown', (ev) => {
      const t = ev.target;
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return; // Ctrl+C (copiar) y otros atajos del navegador siguen funcionando
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      if (ev.key === ' ') {
        if (t && (t.tagName === 'BUTTON' || t.tagName === 'A')) return; // la barra espaciadora activa el botón con foco
        ev.preventDefault(); alternar();
      }
      if (ev.key === 'c' || ev.key === 'C') { ev.preventDefault(); marcarAqui(); }
    });
    $('decideIn').addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && S.confirmando && !S.decidiendo) cerrarConfirmacion();
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.store) refrescar(true); });

    // La barra fija de abajo cambia de alto (dos renglones en celular, la confirmación): el final de la página se corre lo mismo.
    const barra = $('decide');
    const medir = () => document.documentElement.style.setProperty('--decide-h', (barra.hidden ? 0 : barra.offsetHeight) + 'px');
    if (window.ResizeObserver) new ResizeObserver(medir).observe(barra);
  }

  // ---------- Arranque ----------
  async function iniciar() {
    $('autor').value = safeLS.get('portal:autor') || '';
    enlazar();
    let proyecto;
    try {
      const r = await fetch('proyectos/' + slug + '/proyecto.json', { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      proyecto = await r.json();
    } catch (e) {
      $('pieza').textContent = 'No encontramos esta pieza';
      const aviso = $('aviso');
      aviso.className = 'notice warn';
      aviso.textContent = 'Revisá que el link esté completo. Si el problema sigue, escribinos y te mandamos uno nuevo.';
      aviso.hidden = false;
      $('decide').hidden = true;
      document.querySelector('main').hidden = true; // sin pieza no hay video ni formulario que mostrar
      return;
    }
    if (!proyecto || !Array.isArray(proyecto.versiones) || !proyecto.versiones.length) {
      $('pieza').textContent = (proyecto && proyecto.pieza) || 'Pieza sin versiones';
      const aviso = $('aviso');
      aviso.className = 'notice';
      aviso.textContent = 'Todavía no subimos ninguna versión para revisar. Te avisamos apenas esté.';
      aviso.hidden = false;
      $('decide').hidden = true;
      document.querySelector('main').hidden = true;
      return;
    }
    S.proyecto = proyecto;
    S.version = (proyecto.versiones[proyecto.versiones.length - 1] || {}).id;
    S.store = CFG.endpoint ? remoteStore() : localStore(proyecto.ejemplos);
    recuperarBorrador();
    cargarVideo();
    renderTodo();
    await refrescar();
    if (S.store.modo === 'remoto' && CFG.refrescoSeg > 0) {
      // Como mínimo cada 10 s: cada consulta lee la planilla entera.
      setInterval(() => { if (!document.hidden) refrescar(true); }, Math.max(10, Number(CFG.refrescoSeg) || 30) * 1000);
    }
  }

  iniciar();
})();
</script>
</body>
</html>
