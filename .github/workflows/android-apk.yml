name: Build Android APK

on:
  push:
    branches:
      - claude/android-screen-control-app-kbj4e4
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show resolved dependencies
        run: gradle -p android :app:dependencies --configuration debugRuntimeClasspath | head -60

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MochiGuard-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiGuard-APK
          path: MochiGuard-v1.0.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mochi-guard-v1.0
          name: 'Mochi Guard v1.0 🌸'
          body: |
            APK de **Mochi Guard** lista para instalar (build debug, firmada automáticamente).

            📲 **Instalación:** descarga `MochiGuard-v1.0.apk` en tu teléfono, ábrelo y acepta
            "instalar apps de origen desconocido" si Android lo pide.

            Después de instalar, entra en **Ajustes 🌷** dentro de la app y concede los
            "permisos mágicos": Acceso a uso, Servicio de bloqueo (Accesibilidad) y
            Mostrar sobre otras apps.
          files: MochiGuard-v1.0.apk
